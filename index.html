<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة — ARRIVE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@600;800&display=swap">
<style>
:root{--blue:#0837C9;--teal:#00C7E6;--page:#F4F8FD;--card:#fff;--ink:#0F172A;--mut:#64748B;--line:#E2E8F0;--line2:#CBD5E1;
--ok:#16A34A;--warn:#F59E0B;--bad:#EF4444;--info:#3B82F6;--r:14px;--shadow:0 1px 3px rgba(15,23,42,.06),0 4px 14px rgba(8,55,201,.06)}
@media (prefers-color-scheme:dark){:root{--page:#0A1020;--card:#111A31;--ink:#E8EEF9;--mut:#8D9BB8;--line:#22304F;--line2:#2E3F66}}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.6 'Cairo',system-ui,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:16px 16px 48px}
.hdr{background:var(--blue);color:#fff;border-radius:var(--r);padding:18px 24px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hdr::after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;background:var(--teal)}
.hdr img{height:30px;display:block;margin-bottom:8px}.hdr h1{margin:0;font-size:22px;font-weight:800}.hdr p{margin:2px 0 0;opacity:.85;font-size:13px}
h2{font-size:18px;font-weight:800;margin:28px 0 4px;display:flex;align-items:center;gap:10px}
h2 i{font-style:normal;background:var(--blue);color:#fff;border-radius:8px;padding:0 10px;font-size:12px;line-height:22px}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c,var(--line2));border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-height:132px;display:flex;flex-direction:column}
.card .t{font-weight:700;font-size:13.5px}.card .u{font-size:11.5px;color:var(--mut)}
.card .v{font:800 30px/1.3 'Inter',sans-serif;direction:ltr;text-align:right;margin:6px 0 0;color:var(--mut)}
.card .p{font:800 15px 'Inter',sans-serif;direction:ltr;text-align:right;color:var(--mut)}
.card .src{margin-top:auto;font-size:11.5px;color:var(--mut);border-top:1px dashed var(--line2);padding-top:6px}
.card.pending .src b{color:var(--warn)}
.card.linked .v{color:var(--ink)}
</style>
</head>
<body><div class="wrap">
<header class="hdr"><img src="logo.png" alt="ARRIVE" onerror="this.style.display='none'"><h1>لوحة الإدارة — البيك أب والميديل مايل</h1><p>هيكل الكروت — المصادر لم تُحدَّد بعد</p></header>
<div id="app"></div>
</div>
<script>
/* ============ تعريف الكروت ============
   كل كارت: id · section · label · unit · tone · hasPct
   source: null = لم يُربط بعد. لاحقًا نكتب هنا من أين يأخذ الكارت (شيت/عمود/شرط) */
const SECTIONS=[
 {id:"fm",no:1,title:"البيك أب (First Mile)",sub:"الملتقَط والمُرحَّل والفاشل — بالطلبات وبعدد الشحنات"},
 {id:"mm",no:2,title:"الميديل مايل",sub:"الأوردرات التي خرجت والتي لم تخرج ونسبتها"}
];
const CARDS=[
 {id:"fm_total",   section:"fm",label:"إجمالي طلبات البيك أب",unit:"طلب",  tone:"--blue", hasPct:false,source:null},
 {id:"fm_done_r",  section:"fm",label:"تم الالتقاط بالكامل",   unit:"طلب",  tone:"--ok",   hasPct:true, source:null},
 {id:"fm_done_s",  section:"fm",label:"تم الالتقاط بالكامل",   unit:"شحنة", tone:"--ok",   hasPct:true, source:null},
 {id:"fm_carry_r", section:"fm",label:"مُرحَّل",               unit:"طلب",  tone:"--warn", hasPct:true, source:null},
 {id:"fm_carry_s", section:"fm",label:"مُرحَّل",               unit:"شحنة", tone:"--warn", hasPct:true, source:null},
 {id:"fm_fail_r",  section:"fm",label:"فشل",                   unit:"طلب",  tone:"--bad",  hasPct:true, source:null},
 {id:"fm_fail_s",  section:"fm",label:"فشل",                   unit:"شحنة", tone:"--bad",  hasPct:true, source:null},
 {id:"mm_total",   section:"mm",label:"إجمالي أوردرات الميديل مايل",unit:"أوردر",tone:"--blue",hasPct:false,source:null},
 {id:"mm_out",     section:"mm",label:"أوردرات خرجت",          unit:"أوردر",tone:"--ok",   hasPct:true, source:null},
 {id:"mm_notout",  section:"mm",label:"أوردرات لم تخرج",       unit:"أوردر",tone:"--bad",  hasPct:true, source:null}
];
/* مزوّدو البيانات: يُملأ لاحقًا بعد تحديد مصدر كل كارت. المفتاح = source.type */
const PROVIDERS={};
function resolve(c){ if(!c.source||!PROVIDERS[c.source.type])return null; try{return PROVIDERS[c.source.type](c.source)}catch(e){return null} }
const fmt=n=>Math.round(n).toLocaleString("en-US");
document.getElementById("app").innerHTML=SECTIONS.map(s=>`
<h2><i>${s.no}</i>${s.title}</h2><p class="sub">${s.sub}</p>
<div class="grid">${CARDS.filter(c=>c.section===s.id).map(c=>{
 const r=resolve(c);
 return `<div class="card ${r?"linked":"pending"}" style="--c:var(${c.tone})" data-id="${c.id}">
  <div class="t">${c.label}</div><div class="u">الوحدة: ${c.unit}</div>
  <div class="v">${r?fmt(r.value):"—"}</div>${c.hasPct?`<div class="p">${r&&r.pct!=null?r.pct.toFixed(1)+"%":"—%"}</div>`:""}
  <div class="src">المصدر: ${r?"مربوط":"<b>لم يُحدَّد بعد</b>"}</div></div>`}).join("")}</div>`).join("");
</script>
</body></html>
